spring.config.activate.on-profile: test

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:kopang;MODE=MySQL
    username: sa
    hikari:
      pool-name: kopang-db-pool
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  h2:
    console:
      enabled: true

# 대기열 워커가 테스트가 넣은 항목을 먼저 가져가지 않도록 끈다. 워커 동작은 테스트에서 직접 호출한다
kopang:
  queue:
    worker:
      enabled: false